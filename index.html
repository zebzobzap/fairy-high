<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#b75562" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fairy High" />
  <title>Fairy High: Entry Challenge</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <section class="game-card" aria-label="Fairy High game">
      <div class="topbar">
        <div>
          <h1>Fairy High: Entry Challenge</h1>
          <p>Collect 3 glowing petals, repair the bridge, then reach Fairy High.</p>
        </div>
        <button id="restartButton" type="button">Restart</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="game" width="320" height="180" aria-label="Fairy High Entry Challenge game canvas"></canvas>
      </div>

      <div class="hud" aria-live="polite">
        <div id="questText">Quest: collect 3 glowing petals.</div>
        <div id="statusText">Petals: 0 / 3</div>
      </div>

      <div class="touch-controls" aria-label="Touch game controls">
        <div class="dpad" aria-label="Movement controls">
          <button class="move up" type="button" data-key="arrowup" aria-label="Move up">▲</button>
          <button class="move left" type="button" data-key="arrowleft" aria-label="Move left">◀</button>
          <button class="move down" type="button" data-key="arrowdown" aria-label="Move down">▼</button>
          <button class="move right" type="button" data-key="arrowright" aria-label="Move right">▶</button>
        </div>
        <button id="interactButton" class="interact-button" type="button">Magic / Talk</button>
      </div>

      <div class="controls">
        <strong>Desktop:</strong> arrow keys or WASD to move; press <kbd>E</kbd> to interact.
        <span class="mobile-note"><strong>iPhone/iPad:</strong> use the on-screen controls.</span>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
